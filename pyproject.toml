[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "axc-wensuo"
dynamic = ["version"]
description = "Offline, Chinese-first RAG engine with no server: any folder becomes a searchable knowledge base for humans and AI agents."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "axclogo", email = "axclogo@163.com" }]
keywords = ["rag", "knowledge-base", "search", "bm25", "chinese", "mcp", "offline"]
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"Natural Language :: Chinese (Simplified)",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Topic :: Text Processing :: Indexing",
]
dependencies = [
	"numpy>=1.26",
	"onnxruntime>=1.18",
	"tokenizers>=0.19",
	"PyYAML>=6.0",
	"filelock>=3.12",
]

[project.optional-dependencies]
docs = ["docling>=2.153,<3"]
mcp = ["mcp>=2.3,<3"]

[project.scripts]
ws = "axc_wensuo.cli:main"

[project.urls]
Homepage = "https://github.com/axclogo/AxcWenSuo"
Repository = "https://github.com/axclogo/AxcWenSuo"
Documentation = "https://github.com/axclogo/AxcWenSuo/blob/main/docs/REQUIREMENTS.md"
Changelog = "https://github.com/axclogo/AxcWenSuo/blob/main/CHANGELOG.md"
Issues = "https://github.com/axclogo/AxcWenSuo/issues"

[dependency-groups]
dev = ["onnx>=1.16", "pytest>=8.0", "ruff>=0.6", "mcp>=2.3,<3"]

[tool.hatch.version]
path = "src/axc_wensuo/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/axc_wensuo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs", "tests/fixtures"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["W191", "E101", "E302", "E305"]
