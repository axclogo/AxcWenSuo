name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - name: Sync dependencies
        run: uv sync --dev
      - name: Run tests
        shell: bash
        # Failed test ids become annotations, readable without signing in. 失败用例写成注解，不登录也能看到。
        run: |
          set -o pipefail
          uv run pytest -q -rfE --tb=line -p no:cacheprovider | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E '^(FAILED|ERROR) ' pytest.log | while read -r line; do echo "::error::$line"; done || true
          exit $status
  docs-extra:
    name: Test docs extra (Docling)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync dependencies
        run: uv sync --dev --extra docs
      - name: Run Docling tests
        run: uv run pytest -q -rfE tests/test_docling.py tests/test_docling_units.py tests/test_sync_isolation.py
