name: 功能建议
description: 提出一个需求或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        请先阅读 docs/REQUIREMENTS.md，确认建议不在明确“不做”的范围内。
        本项目以需求文档为唯一开发依据，涉及行为变更的建议会先讨论文档。
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 你遇到的实际问题是什么？请描述使用场景。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
